; Local PHP CLI config for Laravel development
extension_dir = "C:\Program Files\php-8.3.30\ext"

extension=curl
extension=fileinfo
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=pdo_sqlite
extension=sodium
extension=sqlite3
extension=zip

; TLS CA bundle (fixes cURL error 60 on Windows for crawler / OpenAI)
curl.cainfo = "E:\chatbot-platform\app\storage\certs\cacert.pem"
openssl.cafile = "E:\chatbot-platform\app\storage\certs\cacert.pem"
